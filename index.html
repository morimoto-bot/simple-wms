<title>簡易WMS</title>
<style>
:root{
  --bg:#f4f6f7; --card:#fff; --text:#16202a; --sub:#5b6773; --line:#d9dee3;
  --pri:#0f766e; --pri-d:#0b5a54; --pri-t:#fff;
  --ok:#15803d; --ok-bg:#dcfce7; --warn:#c2410c; --warn-bg:#ffedd5; --bad:#b91c1c; --bad-bg:#fee2e2; --mute-bg:#eef1f3;
  --shadow:0 1px 3px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10161b; --card:#1a232b; --text:#e8edf1; --sub:#9aa7b3; --line:#2c3844;
    --pri:#2dd4bf; --pri-d:#14b8a6; --pri-t:#05211e;
    --ok:#4ade80; --ok-bg:#12351f; --warn:#fb923c; --warn-bg:#3b2410; --bad:#f87171; --bad-bg:#3d1717; --mute-bg:#232e38;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--pri);color:var(--pri-t)}
header h1{font-size:17px;margin:0;flex:1;font-weight:700}
.chip{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.22);border:0;color:inherit;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.iconbtn{border:0;background:rgba(255,255,255,.22);color:inherit;width:38px;height:38px;border-radius:10px;font-size:20px}
@media (prefers-color-scheme:dark){ header{background:#0f2f2c;color:#d7fffa} }
nav#tabs{position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:19;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--card);border-bottom:1px solid var(--line)}
nav#tabs::-webkit-scrollbar{display:none}
nav#tabs button{flex:1 0 auto;border:0;background:none;padding:11px 14px 9px;font-weight:700;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
nav#tabs button[aria-selected=true]{color:var(--pri);border-bottom-color:var(--pri)}
main{max-width:720px;margin:0 auto;padding:10px 12px}
body.wide main{max-width:1100px}
body.wide table.t{font-size:15px}
.chk{width:22px;height:22px;flex:none;margin-right:4px}
#manualJan.kbdon{border-color:var(--pri,#0a84ff);box-shadow:0 0 0 2px rgba(10,132,255,.25)}
body.wide #camBox,body.wide #camBtn,body.wide [data-act=photo],body.wide #manualJan,body.wide #manualJan+button{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}
.name{font-size:19px;font-weight:700;line-height:1.3;word-break:break-word}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--mute-bg);color:var(--sub)}
.tag.loc{background:#e0f2fe;color:#075985}
@media (prefers-color-scheme:dark){.tag.loc{background:#0c2c3f;color:#7dd3fc}}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);padding:11px 14px;border-radius:12px;font-weight:700;min-height:44px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-t)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:6px 10px;min-height:34px;font-size:14px}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.45}
.btn{white-space:nowrap}
input[type=text],input[type=number],input[type=search],input[type=tel],input[type=password],input[type=url],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
label.f{display:block;margin:8px 0 4px;font-size:13px;font-weight:700;color:var(--sub)}
#camBox{position:relative;background:#000;border-radius:14px;overflow:hidden;height:clamp(160px,27vh,300px);margin-top:4px}
#camBox video{width:100%;height:100%;object-fit:cover;display:block}
#camBox .frame{position:absolute;left:4%;right:4%;top:22%;bottom:22%;border:2px solid rgba(255,255,255,.85);border-radius:10px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.28)}
#camBox.flash .frame{border-color:#4ade80;box-shadow:0 0 0 9999px rgba(74,222,128,.28)}
#camBox .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:16px;font-size:14px;background:rgba(0,0,0,.55)}
#camBox .msg.hide{display:none}
#camBox .codebar{position:absolute;left:0;right:0;bottom:0;display:none;align-items:center;gap:8px;padding:8px 10px;background:rgba(15,118,110,.92);color:#fff;font-size:14px;font-weight:700}
#camBox .codebar.on{display:flex}
#camBox .codebar span{flex:1}
#camBox .codebar button{border:0;border-radius:8px;padding:6px 12px;font-weight:700;background:#fff;color:#0b5a54}
.seg{display:flex;gap:0;margin:4px 0 8px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{flex:1;border:0;background:none;padding:10px 6px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--pri);color:var(--pri-t)}
.steps{display:flex;gap:6px;margin:6px 0}
.steps span{flex:1;text-align:center;padding:7px 4px;border-radius:10px;background:var(--mute-bg);color:var(--sub);font-weight:700;font-size:13px}
.steps span.cur{background:var(--pri);color:var(--pri-t)}
.steps span.done{background:var(--ok-bg);color:var(--ok)}
.stepper{display:flex;gap:8px;align-items:center}
.stepper button{width:54px;height:54px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:26px;font-weight:700}
.stepper input{width:96px;text-align:center;font-size:24px;font-weight:700;min-height:54px}
.kv{display:flex;gap:10px;margin:8px 0}
.kv>div{flex:1;background:var(--mute-bg);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--sub)}
.kv b{display:block;font-size:22px;color:var(--text)}
.item{border-left:6px solid var(--line);padding:10px 10px 10px 12px;margin:8px 0;background:var(--card);border-radius:10px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.item.match{border-left-color:var(--ok);background:linear-gradient(0deg,var(--ok-bg),var(--ok-bg))}
.item.short{border-left-color:var(--warn);background:linear-gradient(0deg,var(--warn-bg),var(--warn-bg))}
.item.over,.item.extra{border-left-color:var(--bad);background:linear-gradient(0deg,var(--bad-bg),var(--bad-bg))}
.item.hot{outline:3px solid var(--pri)}
.item .nums{font-size:15px}
.item .nums b{font-size:20px}
.mini{display:flex;gap:6px;align-items:center}
.mini button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;font-weight:700}
.banner{border-radius:14px;padding:14px;text-align:center;font-size:26px;font-weight:800;margin:10px 0}
.banner.ok{background:var(--ok-bg);color:var(--ok)} .banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner small{display:block;font-size:13px;font-weight:600;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:7px 12px;background:var(--card);font-weight:600}
.chips input{width:18px;height:18px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:#1f2933;color:#fff;border-radius:12px;padding:10px 14px;max-width:560px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast div.warn{background:#9a3412} #toast div.bad{background:#991b1b} #toast div.ok{background:#166534}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
#modal h2{margin:0 0 6px;font-size:18px}
.hint{background:var(--mute-bg);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--sub)}
.err{color:var(--bad);font-size:14px}
.pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--mute-bg);border-radius:10px;padding:8px 10px;word-break:break-all}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
.sw{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.sw input{width:22px;height:22px}
.diff-pos{color:var(--bad);font-weight:700}.diff-neg{color:var(--warn);font-weight:700}.diff-zero{color:var(--ok);font-weight:700}
</style>

<body>
<header>
  <h1>簡易WMS</h1>
  <button class="chip" id="status" data-act="settings" title="接続状態">未設定</button>

<main>
  <div id="camBox">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <div class="frame"></div>
    <div class="msg" id="camMsg">「カメラ開始」を押してください</div>

  </div>
  <div class="row wrap" style="margin-top:8px">

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.23.0/umd/index.min.js" integrity="sha384-0ASr5PEWAMtTnWsn0PzKmioHVDA4+QqFiJr94io/0DCrGP6E1gRAmbO6O8y5WZW9" crossorigin="anonymous" defer></script>
<script>
'use strict';
/* =====================================================================
 * ロジック（画面に依存しない部分。Nodeの単体テストでこの範囲を取り出して検証する）
 * ===================================================================== */
/* <logic> */
const Logic = (function () {
  function nfkc(s) { s = String(s == null ? '' : s); return s.normalize ? s.normalize('NFKC') : s; }
  function janDigits(v) { return nfkc(v).replace(/\D/g, ''); }
  function janKey(d) { const k = String(d).replace(/^0+/, ''); return k === '' ? '0' : k; }
  function checkDigitOk(d) {
    let sum = 0;
    for (let i = d.length - 2, w = 3; i >= 0; i--, w = (w === 3 ? 1 : 3)) sum += Number(d.charAt(i)) * w;
    return ((10 - (sum % 10)) % 10) === Number(d.charAt(d.length - 1));
  }
  function validateJan(raw) {
    const d = janDigits(raw);
    if (!d) return { ok: false, reason: 'JANが空です' };
    if (d.length !== 8 && d.length !== 12 && d.length !== 13) return { ok: false, reason: 'JANは8・12・13桁です（' + d.length + '桁）' };
    if (!checkDigitOk(d)) return { ok: false, reason: 'チェックデジットが合いません' };
    return { ok: true, jan: d, key: janKey(d) };
  }
  function normLocation(v) {
    return nfkc(v).replace(/[‐-―−－]/g, '-').toUpperCase().replace(/\s+/g, ' ').trim();
  }
  function yen(n) { return (n === null || n === undefined || n === '') ? '' : '¥' + Number(n).toLocaleString('ja-JP'); }

  function speechText(item) {
    let name = String(item.name || '').replace(/[【】\[\]（）()「」『』]/g, ' ').replace(/\s+/g, ' ').trim();
    if (name.length > 40) name = name.slice(0, 40);
    const p = (item.price === null || item.price === undefined || item.price === '') ? '' : '、' + Number(item.price) + '円';
    return name + p;
  }

  /* ---- 取り込み・検品予定の書式 ---- */
  function splitCells(line) {
    const delim = line.indexOf('\t') >= 0 ? '\t' : (line.indexOf(',') >= 0 ? ',' : null);
    if (delim === null) return nfkc(line).trim().split(/\s+/);
    const cells = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (inQ) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
      else if (c === '"') inQ = true;
      else if (c === delim) { cells.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cells.push(cur.trim());
    return cells;
  }

  /** 検品の予定: 1行1品。`JAN,予定数[,商品名]`。予定数が数字でない行（例: JAN,商品名）は defaultQty にする */
  function parsePlanText(text, defaultQty) {
    const dq = Math.max(1, Math.floor(Number(defaultQty)) || 1);
    const rows = []; const errors = []; const byKey = {};
    const lines = String(text || '').replace(/^﻿/, '').split(/\r\n|\r|\n/);
    let first = true;
    lines.forEach(function (line, i) {
      if (/^\s*$/.test(line) || /^\s*#/.test(line)) return;
      const cells = splitCells(line);
      if (first) { first = false; if (!/^'?\d+$/.test(nfkc(cells[0]).replace(/\s/g, ''))) return; }
      const v = validateJan(cells[0]);
      if (!v.ok) { errors.push({ line: i + 1, text: line, reason: v.reason }); return; }
      let q = dq;
      if (cells.length > 1 && cells[1] !== '' && /^[0-9０-９]+$/.test(cells[1])) q = Number(nfkc(cells[1]));
      else if (cells.length > 1 && /^-/.test(cells[1])) { errors.push({ line: i + 1, text: line, reason: '予定数が負です' }); return; }
      if (q < 1) { errors.push({ line: i + 1, text: line, reason: '予定数は1以上です' }); return; }
      if (byKey[v.key]) { byKey[v.key].planned += q; return; }
      const r = { jan: v.jan, key: v.key, planned: q, name: cells.length > 2 ? cells[2] : '', line: i + 1 };
      byKey[v.key] = r; rows.push(r);
    });
    return { rows: rows, errors: errors };
  }

  function planFromMaster(items, qty) {
    const q = Math.max(1, Math.floor(Number(qty)) || 1);
    return items.map(function (it) { return it.jan + ',' + q + ',' + String(it.name || '').replace(/[\r\n,]/g, ' '); }).join('\n');
  }

  /** ファイルのバイト列を文字列に。UTF-8でなければShift_JIS（Excelで保存したCSV対策） */
  function decodeBytes(buf) {
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let s;
    try { s = new TextDecoder('utf-8', { fatal: true }).decode(u8); }
    catch (e) { s = new TextDecoder('shift_jis').decode(u8); }
    return s.replace(/^﻿/, '');
  }

  function parseFragment(hash) {
    const h = String(hash || '').replace(/^#/, '');
    if (!h) return null;
    const p = new URLSearchParams(h);
    const gas = p.get('gas'), token = p.get('token');
    if (!gas && !token) return null;
    return { gas: gas || undefined, token: token || undefined };
  }

  function gasUrlProblem(u) {
    u = String(u || '').trim();
    if (!u) return '未入力です';
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(u)) {
      if (/\/dev$/.test(u)) return '末尾が /dev です。デプロイ後の /exec のURLを入れてください';
      return 'https://script.google.com/macros/s/…/exec の形式ではありません';
    }
    return '';
  }

  /* ---- 検品 ---- */
  function inspStatus(r) {
    if (r.planned === 0) return r.actual > 0 ? 'extra' : 'none';
    if (r.actual === r.planned) return 'match';
    return r.actual < r.planned ? 'short' : 'over';
  }
  function inspSummary(rows) {
    const s = { total: 0, match: 0, short: 0, over: 0, extra: 0, planned: 0, actual: 0 };
    rows.forEach(function (r) {
      const st = inspStatus(r);
      if (st === 'none') return;
      s.total++; s[st]++; s.planned += r.planned; s.actual += r.actual;
    });
    s.allOk = s.total > 0 && s.short === 0 && s.over === 0 && s.extra === 0;
    return s;
  }

  /* ---- 棚卸 ---- */
  function stkView(session, masterItems) {
    const scope = session.scope || [];
    const inScope = function (loc) { return scope.length === 0 || scope.indexOf(normLocation(loc)) >= 0; };
    const byKey = {};
    masterItems.forEach(function (it) { byKey[janKey(it.jan)] = it; });
    const counted = [];
    (session.order || []).forEach(function (k) {
      const c = session.counts[k]; if (!c) return;
      const it = byKey[k] || { jan: c.jan, name: '（マスタ未登録）', location: '', stock: 0 };
      counted.push({ key: k, jan: it.jan, name: it.name, location: it.location || '', book: it.stock, actual: c.actual,
        diff: c.actual - it.stock, outOfScope: scope.length > 0 && !inScope(it.location) });
    });
    const uncounted = masterItems.filter(function (it) { return !session.counts[janKey(it.jan)] && inScope(it.location); });
    return { counted: counted, uncounted: uncounted };
  }

  /* ---- 在庫一覧 ---- */
  function filterStock(items, o) {
    const q = nfkc(o.q || '').toLowerCase().trim();
    const loc = o.loc ? normLocation(o.loc) : '';
    let out = items.filter(function (it) {
      if (loc && normLocation(it.location) !== loc) return false;
      if (!q) return true;
      return (nfkc(it.name) + ' ' + it.jan + ' ' + nfkc(it.location)).toLowerCase().indexOf(q) >= 0;
    });
    const cmp = function (a, b) { return String(a).localeCompare(String(b), 'ja', { numeric: true }); };
    const byLoc = function (a, b) {
      if (!a.location && b.location) return 1; if (a.location && !b.location) return -1;
      return cmp(a.location, b.location) || cmp(a.name, b.name);
    };
    const sorters = {
      loc: byLoc,
      name: function (a, b) { return cmp(a.name, b.name); },
      stockAsc: function (a, b) { return a.stock - b.stock || byLoc(a, b); },
      stockDesc: function (a, b) { return b.stock - a.stock || byLoc(a, b); }
    };
    out = out.slice().sort(sorters[o.sort] || sorters.loc);
    return out;
  }

  /* ---- 画像→読み取り ---- */
  function rgbaToGray(data, w, h) {
    const g = new Uint8ClampedArray(w * h);
    for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (data[j] * 299 + data[j + 1] * 587 + data[j + 2] * 114) / 1000;
    return g;
  }
  /** グレー画像を90度回転（縦向きのバーコードを写真から読む時に使う） */
  function rotate90Gray(g, w, h) {
    const out = new Uint8ClampedArray(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) out[x * h + (h - 1 - y)] = g[y * w + x];
    return out;
  }
  /** video要素（object-fit: cover の箱）に見えている範囲の中から、枠（左右4%・上下22%を除いた部分）をvideo座標で返す */
  function cropRegion(vw, vh, bw, bh) {
    const boxAr = bw / bh, vidAr = vw / vh;
    let visW, visH, visX, visY;
    if (vidAr > boxAr) { visH = vh; visW = vh * boxAr; visX = (vw - visW) / 2; visY = 0; }
    else { visW = vw; visH = vw / boxAr; visX = 0; visY = (vh - visH) / 2; }
    return { x: Math.round(visX + visW * 0.04), y: Math.round(visY + visH * 0.22), w: Math.round(visW * 0.92), h: Math.round(visH * 0.56) };
  }
  /** kind: 'product'（EAN/UPCだけ。商品用）／'code'（ロケ・伝票番号用にCode 128・Code 39・QRも読む） */
  function createDecoder(ZX, kind) {
    const hints = new Map();
    const BF = ZX.BarcodeFormat;
    hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, kind === 'code'
      ? [BF.EAN_13, BF.EAN_8, BF.UPC_A, BF.CODE_128, BF.CODE_39, BF.QR_CODE, BF.ITF, BF.CODABAR]
      : [BF.EAN_13, BF.EAN_8, BF.UPC_A]);
    hints.set(ZX.DecodeHintType.TRY_HARDER, true);
    const reader = new ZX.MultiFormatReader();
    reader.setHints(hints);
    // ZXingは「バーコードなし」のたびに警告をconsoleへ出す（毎フレーム出て邪魔になる）ので、その警告だけ捨てる
    const quiet = function (fn) {
      if (typeof console === 'undefined') return fn();
      const w = console.warn, l = console.log;
      const filt = function (orig) { return function () { if (typeof arguments[0] === 'string' && arguments[0].indexOf('MultiFormatReader') === 0) return; return orig.apply(console, arguments); }; };
      console.warn = filt(w); console.log = filt(l);
      try { return fn(); } finally { console.warn = w; console.log = l; }
    };
    return function decode(gray, w, h) {
      try {
        const src = new ZX.RGBLuminanceSource(gray, w, h);
        const bmp = new ZX.BinaryBitmap(new ZX.HybridBinarizer(src));
        const res = quiet(function () { return reader.decodeWithState(bmp); });
        return res ? res.getText() : null;
      } catch (e) { return null; }
    };
  }

  /** 入荷予定・伝票の作成用: `コード[,数量[,商品名]]`（コードはSKUまたはJAN。ここでは検証せずサーバーが解決する） */
  function parseCodeQtyText(text, defaultQty) {
    const dq = Math.max(1, Math.floor(Number(defaultQty)) || 1);
    const rows = [], errors = [];
    const HEAD = ['jan', 'sku', 'code', 'コード', '商品コード', 'jan/sku', 'skuまたはjan', 'バーコード', '品番'];
    let seen = false;
    String(text || '').replace(/^﻿/, '').split(/\r\n|\r|\n/).forEach(function (line, i) {
      if (/^\s*$/.test(line)) return;
      const cells = splitCells(line);
      const c0 = nfkc(cells[0]).toLowerCase().replace(/\s+/g, '');
      if (!seen) { seen = true; if (HEAD.indexOf(c0) >= 0) return; }
      if (!c0) { errors.push({ line: i + 1, text: line, reason: 'コードがありません' }); return; }
      let q = dq;
      if (cells.length > 1 && cells[1] !== '') {
        const t = nfkc(cells[1]).replace(/\s/g, '');
        if (/^\d+$/.test(t)) q = Number(t);
        else if (/^-\d+$/.test(t)) { errors.push({ line: i + 1, text: line, reason: '数量が1以上ではありません' }); return; }
      }
      if (q < 1) { errors.push({ line: i + 1, text: line, reason: '数量は1以上です' }); return; }
      rows.push({ code: cells[0].trim(), qty: q, name: cells.length > 2 ? cells[2] : '', line: i + 1 });
    });
    return { rows: rows, errors: errors };
  }

  /* ---- 入荷予定の消込（検品済数 = サーバー保存分 + 今回の追加） ---- */
  function rcvStatus(l) {
    const total = (l.inspected || 0) + l.now;
    if (l.extra) return total > 0 ? 'extra' : 'none';
    if (l.now === 0 && (l.state === '消込' || l.received >= l.planned)) return 'none';
    if (total === l.planned) return 'match';
    return total < l.planned ? 'short' : 'over';
  }
  function rcvSummary(lines) {
    const s = { total: 0, match: 0, short: 0, over: 0, extra: 0, nowTotal: 0, remainAfter: 0 };
    lines.forEach(function (l) {
      const total = (l.inspected || 0) + l.now, st = rcvStatus(l);
      s.nowTotal += Math.max(0, total - l.received);
      if (!l.extra && l.state !== '消込') s.remainAfter += Math.max(0, l.planned - Math.max(total, l.received));
      if (st === 'none') return;
      s.total++; s[st]++;
    });
    return s;
  }

  /* ---- 出荷（伝票）の在庫前後プレビュー ---- */
  function shipPreview(lines) {
    let short = 0, total = 0;
    const rows = lines.map(function (l) {
      const after = l.stock - l.qty;
      if (after < 0) short++;
      total += l.qty;
      return Object.assign({}, l, { after: after, short: after < 0 });
    });
    return { rows: rows, short: short, total: total };
  }

  /** CSV文字列（見出し＋行）。式として解釈される先頭文字（= + @）は ' を付けて無害化し、カンマ・引用符・改行は引用符で囲む */
  function toCsv(header, rows) {
    const cell = function (v) {
      let t = v === null || v === undefined ? '' : String(v);
      if (/^[=+@\t\r]/.test(t)) t = "'" + t;
      return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    return [header].concat(rows).map(function (r) { return r.map(cell).join(','); }).join('\r\n') + '\r\n';
  }

  /** 送り状番号の比較用: 全角→半角、空白とハイフンを除き、英字は大文字（GASの normTracking_ と同じ） */
  function normTracking(v) { return nfkc(v).replace(/[\s\-]/g, '').toUpperCase(); }

  function reasonOk(r) { const t = String(r == null ? '' : r).replace(/\s+/g, ' ').trim(); return t.length >= 1 && t.length <= 100; }

  /* ---------- 送り状発行用CSV（宛先は画面のメモリ上だけで扱う。GAS・シート・履歴・端末の保存領域には書かない） ----------
   * 手本: Shopify送り状拡張（ヤマトB2=42列／佐川e飛伝III=74列／ゆうプリR=105列／クリックポストまとめ申込=8列）。
   * 注文CSV（Shopifyの標準エクスポート）→ 配送方法で出力先を振り分け → 各社の取り込みCSVを作る。 */

  /** CSV全体を「行×セル」にする。引用符の中の改行・"" に対応。区切りはカンマ（1行目にカンマが無くタブがあればタブ） */
  function parseCsvRecords(text) {
    const s = String(text == null ? '' : text).replace(/^﻿/, '');
    const first = s.split(/\r\n|\r|\n/)[0] || '';
    const delim = first.indexOf('\t') >= 0 && first.indexOf(',') < 0 ? '\t' : ',';
    const recs = []; let row = [], cur = '', inQ = false;
    const endRow = function () { row.push(cur); cur = ''; if (row.length > 1 || row[0] !== '') recs.push(row); row = []; };
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (inQ) { if (c === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else inQ = false; } else cur += c; }
      else if (c === '"') inQ = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && s[i + 1] === '\n') i++; endRow(); }
      else cur += c;
    }
    if (cur !== '' || row.length) endRow();
    return recs;
  }

  const PREF_JA = ['北海道', '青森県', '岩手県', '宮城県', '秋田県', '山形県', '福島県', '茨城県', '栃木県', '群馬県', '埼玉県', '千葉県', '東京都', '神奈川県', '新潟県', '富山県', '石川県', '福井県', '山梨県', '長野県', '岐阜県', '静岡県', '愛知県', '三重県', '滋賀県', '京都府', '大阪府', '兵庫県', '奈良県', '和歌山県', '鳥取県', '島根県', '岡山県', '広島県', '山口県', '徳島県', '香川県', '愛媛県', '高知県', '福岡県', '佐賀県', '長崎県', '熊本県', '大分県', '宮崎県', '鹿児島県', '沖縄県'];
  const PREF_EN = ['hokkaido', 'aomori', 'iwate', 'miyagi', 'akita', 'yamagata', 'fukushima', 'ibaraki', 'tochigi', 'gunma', 'saitama', 'chiba', 'tokyo', 'kanagawa', 'niigata', 'toyama', 'ishikawa', 'fukui', 'yamanashi', 'nagano', 'gifu', 'shizuoka', 'aichi', 'mie', 'shiga', 'kyoto', 'osaka', 'hyogo', 'nara', 'wakayama', 'tottori', 'shimane', 'okayama', 'hiroshima', 'yamaguchi', 'tokushima', 'kagawa', 'ehime', 'kochi', 'fukuoka', 'saga', 'nagasaki', 'kumamoto', 'oita', 'miyazaki', 'kagoshima', 'okinawa'];
  /** 都道府県: 日本語はそのまま。英語（Tōkyō も可）と JP-13 形式のコードは日本語にする */
  function normProvince(p) {
    const t = String(p == null ? '' : p).trim();
    if (!t || /[　-鿿]/.test(t)) return t;
    const m = t.match(/^JP-?(\d{1,2})$/i);
    if (m && Number(m[1]) >= 1 && Number(m[1]) <= 47) return PREF_JA[Number(m[1]) - 1];
    const i = PREF_EN.indexOf(t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase());
    return i >= 0 ? PREF_JA[i] : t;
  }
  function cleanZip(v) { return nfkc(v).replace(/[^0-9]/g, '').slice(0, 7); }
  /** 電話: 先頭の ' や +81 を直し、ハイフン区切りにする */
  function cleanPhone(v) {
    let d = nfkc(v).replace(/^'/, '').trim();
    if (/^\+81/.test(d)) d = '0' + d.slice(3).replace(/[^0-9]/g, '').replace(/^0/, '');
    d = d.replace(/[^0-9]/g, '');
    if (d.length === 11) return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
    if (d.length === 10) return d.slice(0, 2) + '-' + d.slice(2, 6) + '-' + d.slice(6);
    return d;
  }

  const ORDER_COLS = {
    no: ['Name', '注文番号', '伝票番号', 'お客様管理番号', '受注コード'],
    method: ['Shipping Method', '配送方法', '配送方法名'],
    toName: ['Shipping Name', 'お届け先氏名', 'お届け先名', '配送先氏名', '氏名'],
    zip: ['Shipping Zip', 'お届け先郵便番号', '郵便番号'],
    province: ['Shipping Province Name', 'Shipping Province', 'お届け先都道府県', '都道府県'],
    city: ['Shipping City', 'お届け先市区町村', '市区町村'],
    addr1: ['Shipping Address1', 'お届け先住所1', 'お届け先住所', '住所1', '住所'],
    addr2: ['Shipping Address2', 'お届け先住所2', '住所2'],
    phone: ['Shipping Phone', 'お届け先電話番号', '電話番号', 'Phone'],
    item: ['Lineitem name', '商品名', '品名'],
    attrs: ['Note Attributes']
  };
  function pickCol(head, names) {
    const hs = head.map(function (h) { return nfkc(h).trim().toLowerCase(); });
    for (let n = 0; n < names.length; n++) { const i = hs.indexOf(names[n].toLowerCase()); if (i >= 0) return i; }
    return -1;
  }

  /** 注文CSV（Shopifyの標準エクスポート／日本語の列名）を、注文ごとに1件へまとめる。宛先は先頭の行だけにあるので、同じ注文番号の行を合わせる */
  function parseShipOrders(text) {
    const recs = parseCsvRecords(text);
    if (recs.length < 2) return { orders: [], errors: ['データの行がありません'] };
    const col = {}; Object.keys(ORDER_COLS).forEach(function (k) { col[k] = pickCol(recs[0], ORDER_COLS[k]); });
    if (col.no < 0) return { orders: [], errors: ['注文番号の列（Name）が見つかりません。Shopifyの注文CSVをそのまま読み込んでください'] };
    const miss = [['zip', '郵便番号'], ['addr1', '住所'], ['toName', '氏名']].filter(function (x) { return col[x[0]] < 0; }).map(function (x) { return x[1]; });
    const by = {}; const orders = [];
    recs.slice(1).forEach(function (r) {
      const get = function (k) { return col[k] >= 0 && r[col[k]] != null ? String(r[col[k]]).trim() : ''; };
      const no = get('no'); if (!no) return;
      let o = by[no];
      if (!o) { o = by[no] = { no: no, method: '', toName: '', zip: '', province: '', city: '', addr1: '', addr2: '', phone: '', item: '', attrs: '' }; orders.push(o); }
      ['method', 'toName', 'zip', 'province', 'city', 'addr1', 'addr2', 'phone', 'attrs', 'item'].forEach(function (k) { if (!o[k]) o[k] = get(k); });
    });
    orders.forEach(function (o) {
      o.zip = cleanZip(o.zip); o.phone = cleanPhone(o.phone); o.province = normProvince(o.province);
      o.toName = o.toName.replace(/^'/, '');
      // セルの中の改行は、取り込みを壊すので取り除く（住所は詰め、氏名・品名は空白にする）
      ['city', 'addr1', 'addr2'].forEach(function (k) { o[k] = o[k].replace(/\s*[\r\n]+\s*/g, ''); });
      ['toName', 'item', 'province', 'method'].forEach(function (k) { o[k] = o[k].replace(/\s*[\r\n]+\s*/g, ' '); });
    });
    return { orders: orders, errors: miss.length ? ['列が見つかりません: ' + miss.join('・') + '（宛先が空になります）'] : [] };
  }

  /** 宛先の不足（発行前に直す）。出力は止めず、一覧で知らせる */
  function orderProblems(o) {
    const p = [];
    if (o.zip.length !== 7) p.push('郵便番号が7桁ではありません');
    if (!o.province && !o.city && !o.addr1) p.push('住所が空です');
    if (!o.toName) p.push('氏名が空です');
    if (!o.phone) p.push('電話番号が空です');
    return p;
  }

  const CARRIER_LABEL = { clickpost: 'クリックポスト', yamato: 'ヤマト運輸', sagawa: '佐川急便', yupack: '日本郵便' };
  const DEFAULT_ROUTES = 'クリックポスト,クリックポスト\nヤマト,ヤマト運輸\n宅急便,ヤマト運輸\n佐川,佐川急便\nゆうパック,日本郵便\nゆうパケット,日本郵便\n日本郵便,日本郵便';
  function carrierKey(t) {
    const s = nfkc(t);
    if (/クリック|click ?post/i.test(s)) return 'clickpost';
    if (/ヤマト|yamato/i.test(s)) return 'yamato';
    if (/佐川|sagawa/i.test(s)) return 'sagawa';
    if (/郵便|ゆう|yupack|japan ?post/i.test(s)) return 'yupack';
    return '';
  }
  /** 振り分けの設定: 1行1つ「配送方法のキーワード,出力先」。上から順に最初に合ったものを使う。キーワードが空なら全件 */
  function parseRoutes(text) {
    const rules = [], errors = [];
    String(text == null ? '' : text).split(/\r\n|\r|\n/).forEach(function (line, i) {
      if (/^\s*$/.test(line) || /^\s*#/.test(line)) return;
      const m = line.match(/^(.*)[,，=＝\t]([^,，=＝\t]*)$/);
      const c = m ? carrierKey(m[2]) : '';
      if (!c) { errors.push((i + 1) + '行目: 出力先が分かりません（ヤマト・佐川・日本郵便・クリックポストのどれか）'); return; }
      rules.push({ kw: nfkc(m[1]).trim(), carrier: c });
    });
    return { rules: rules, errors: errors };
  }
  function routeOrder(method, rules) {
    const t = nfkc(method).toLowerCase();
    for (let i = 0; i < rules.length; i++) if (!rules[i].kw || t.indexOf(rules[i].kw.toLowerCase()) >= 0) return rules[i].carrier;
    return '';
  }

  /** お届け希望（Note Attributes は「キー: 値」の行） */
  function noteAttr(o, key) {
    if (!key) return '';
    const k = nfkc(key).trim();
    const lines = String(o.attrs || '').split(/\r\n|\r|\n/);
    for (let i = 0; i < lines.length; i++) {
      const j = lines[i].indexOf(':');
      if (j > 0 && nfkc(lines[i].slice(0, j)).trim() === k) return lines[i].slice(j + 1).trim();
    }
    return '';
  }
  const TIME_SLOTS = [['午前', '0812', '1', '01'], ['12-14', '1214', '2', '02'], ['14-16', '1416', '3', '03'], ['16-18', '1618', '4', '04'], ['18-20', '1820', '5', '05'], ['19-21', '1921', '6', '06']];
  /** 時間帯（午前中／14〜16時／14:00-16:00 など）を各社のコードにする。分からなければ空欄 */
  function timeCode(value, carrier) {
    const t = nfkc(value).replace(/\s/g, '').replace(/[〜～~–—]/g, '-').replace(/:00/g, '').replace(/時/g, '');
    if (!t) return '';
    let key = /^午前/.test(t) ? '午前' : '';
    if (!key) { const m = t.match(/(\d{1,2})-(\d{1,2})/); if (m) key = Number(m[1]) + '-' + Number(m[2]); }
    const slot = TIME_SLOTS.filter(function (s) { return s[0] === key; })[0];
    return slot ? slot[{ yamato: 1, sagawa: 2, yupack: 3 }[carrier]] : '';
  }
  function slashDate(v) { return String(v || '').trim().replace(/-/g, '/'); }
  function fullAddress(o) { return [o.province, o.city, o.addr1, o.addr2].filter(Boolean).join(''); }
  function itemName(o) { return o.item || '商品'; }

  /**
   * 1つの出力先ぶんのCSVを作る。戻り値: [{ name, header, rows }]（クリックポストは40件ごとに分割）
   * ctx = { shipper: {name, postCode, address, phone}, dateKey, timeKey, today: 'YYYY/MM/DD', ymd: 'YYYYMMDD' }
   */
  function buildCarrierCsv(carrier, orders, ctx) {
    const sh = ctx.shipper || {}, sAddr = sh.address || '', sZip = String(sh.postCode || '').replace(/[^0-9]/g, '');
    const dt = function (o, c) { return [slashDate(noteAttr(o, ctx.dateKey)), timeCode(noteAttr(o, ctx.timeKey), c)]; };

/* ---------- 通信（GAS） ---------- */
class ApiError extends Error { constructor(code, message, data) { super(message); this.code = code; this.data = data || {}; } }

async function api(action, payload, method) {
  payload = payload || {}; method = method || 'POST';
  if (!S.cfg.gas) throw new ApiError('config', '設定（⚙）でGASのURLと合言葉を入れてください');
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  let res, text;
  try {
    if (method === 'GET') {
      const u = new URL(S.cfg.gas);
      u.searchParams.set('action', action);
      if (action !== 'ping') u.searchParams.set('token', S.cfg.token);
      Object.keys(payload).forEach((k) => { if (payload[k] !== undefined && payload[k] !== null) u.searchParams.set(k, payload[k]); });
      res = await fetch(u.toString(), { signal: ctrl.signal, redirect: 'follow' });
    } else {
      // text/plain にして、ブラウザの事前確認（プリフライト）を避ける
      res = await fetch(S.cfg.gas, {
        method: 'POST', redirect: 'follow', signal: ctrl.signal,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action, token: S.cfg.token }, payload))
      });
    }
    text = await res.text();
  } catch (e) {
    if (e.name === 'AbortError') throw new ApiError('timeout', '通信がタイムアウトしました（30秒）');
    throw new ApiError('network', '通信できません（' + (e.message || e) + '）。URLの公開設定（全員）と電波を確認してください');
  } finally { clearTimeout(timer); }
  let data;
  try { data = JSON.parse(text); } catch (e) {
    throw new ApiError('not_json', 'GASがJSONを返しませんでした。URLが /exec か、公開設定が「全員」か確認してください');
  }
  if (!data.ok) throw new ApiError(data.error || 'error', data.message || '失敗しました', data);
  return data;
}

function errText(e) {
  if (e instanceof ApiError) {
    const map = { unauthorized: '合言葉が違います', insufficient_stock: '在庫が足りません', not_in_master: 'マスタにないJANがあります', already_imported: '取り込み済みです', busy: '他の処理中です。もう一度押してください' };
    return (map[e.code] || '') && (map[e.code] + (e.data && e.data.message ? '：' + e.data.message : '')) || e.message;
  }
  return e && e.message ? e.message : String(e);
}

let audioCtx = null;
function unlockMedia() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !audioCtx) audioCtx = new AC();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { }
  try {
    if (window.speechSynthesis && !S.speechUnlocked) {
      const u = new SpeechSynthesisUtterance(''); u.volume = 0; speechSynthesis.speak(u); S.speechUnlocked = true;
    }
  } catch (e) { }
}
function beep(kind) {
  if (!S.cfg.sound || !audioCtx) return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = kind === 'ng' ? 220 : (kind === 'ok' ? 1320 : 1040);
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (kind === 'ng' ? 0.28 : 0.12));
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.3);
  } catch (e) { }
}
function buzz(ms) { try { if (S.cfg.vibrate && navigator.vibrate) navigator.vibrate(ms || 60); } catch (e) { } }
function flash() { const b = $('#camBox'); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 260); }
function speak(text) {
  if (!S.cfg.speech || !text || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; u.rate = 1.05;
    const v = speechSynthesis.getVoices().find((x) => /^ja/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { }
}
function onDetected() { beep('scan'); buzz(60); flash(); }

const Scanner = {
  stream: null, timer: null, decode: null, canvas: document.createElement('canvas'), wake: null,
  ready() { if (!window.ZXing) return false; if (!this.decode) { this.decode = Logic.createDecoder(window.ZXing, 'product'); this.decodeCode = Logic.createDecoder(window.ZXing, 'code'); } return true; },
  async start() {
    if (!this.ready()) throw new Error('ZXing-js を読み込めていません（ネットワークを確認してください）');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('この表示ではカメラを使えません。https:// のURLで開いているか確認してください');
    }
    unlockMedia();
    const tries = [
      { video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode: 'environment' }, audio: false },
      { video: true, audio: false }
    ];
    let stream = null, lastErr = null;
    for (const c of tries) {
      try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
      catch (e) { lastErr = e; if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) break; }
    }
    if (!stream) throw lastErr || new Error('カメラを開始できません');
    this.stream = stream;
    const v = $('#video'); v.srcObject = stream; v.setAttribute('playsinline', ''); v.muted = true;
    await v.play();
    const tr = stream.getVideoTracks()[0];
    if (tr) {
      tr.addEventListener('ended', () => { if (S.cam.state === 'on') setCam('error', 'カメラが止まりました。「カメラ開始」を押し直してください'); });
      try { await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) { }
    }
    try { if (navigator.wakeLock) this.wake = await navigator.wakeLock.request('screen'); } catch (e) { }
  },
  stop() {
    clearTimeout(this.timer); this.timer = null;
    if (this.stream) this.stream.getTracks().forEach((t) => t.stop());
    this.stream = null;
    const v = $('#video'); v.srcObject = null;
    try { if (this.wake) this.wake.release(); } catch (e) { }
    this.wake = null;
  },
  loop() {
    if (S.cam.state !== 'on') return;
    const t0 = performance.now();
    try {
      const v = $('#video');
      if (v.readyState >= 2 && v.videoWidth) {
        const box = $('#camBox');
        const r = Logic.cropRegion(v.videoWidth, v.videoHeight, box.clientWidth || 4, box.clientHeight || 3);
        const sc = Math.min(1, 800 / r.w);
        const w = Math.max(1, Math.round(r.w * sc)), h = Math.max(1, Math.round(r.h * sc));
        const cv = this.canvas; cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(v, r.x, r.y, r.w, r.h, 0, 0, w, h);
        const img = ctx.getImageData(0, 0, w, h);

      }
    } catch (e) { /* 1フレームの失敗は無視 */ }
    this.timer = setTimeout(() => this.loop(), Math.max(25, 100 - (performance.now() - t0)));
  }

  const texts = { off: '「カメラ開始」を押してください', starting: 'カメラを起動しています…（許可を求められたら「許可」）', on: '', error: msg };
  m.textContent = texts[state] || msg || ''; m.classList.toggle('hide', state === 'on');
  b.textContent = state === 'on' ? 'カメラ停止' : (state === 'error' ? 'カメラをやり直す' : 'カメラ開始');
  b.disabled = state === 'starting';
}
function camErrorMessage(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'カメラが許可されていません。iPhoneの「設定 → Safari → カメラ」を「確認」か「許可」にして、このページを開き直してください（ホーム画面アプリの場合は、一度Safariのブラウザ表示で許可すると直ることがあります）';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'カメラが見つかりません';
  if (n === 'NotReadableError' || n === 'AbortError') return 'カメラを他のアプリが使っているようです。他のアプリを閉じてやり直してください';
  return (e && e.message) || 'カメラを開始できません';
}
async function camToggle() {
  if (S.cam.state === 'on') { Scanner.stop(); setCam('off'); return; }
  setCam('starting');
  try { await Scanner.start(); setCam('on'); Scanner.loop(); }
  catch (e) { Scanner.stop(); S.cam.lastError = (e && e.name ? e.name + ': ' : '') + (e && e.message || ''); setCam('error', camErrorMessage(e)); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && S.cam.state === 'on') { Scanner.stop(); setCam('off'); }
});

/* ---------- スキャン結果の処理 ---------- */
function handleDetected(text) {
  const now = Date.now(), last = S.cam.last;
  const same = text === last.text && now - last.t < 1000;
  last.text = text; last.t = now;       // 映っている間は更新し続け、外れてから1秒たつまで再受付しない
  if (same || (S.modal && !S.codeScan) || S.sending || S.scanBusy) return;
  if (S.codeScan) { onCodeScanned(text); return; }
  onScan(text);
}

async function onScan(raw) {
  if (S.codeScan) { onCodeScanned(String(raw)); return; }   // 手入力・写真からでも、コード読み取り中はそちらへ
  const v = Logic.validateJan(raw);
  if (!v.ok) { beep('ng'); toast(v.reason + '：' + raw, 'warn'); return; }
  onDetected();
  S.scanBusy = true;
  try {
    let item = null;
    try { item = await findItem(v.jan); } catch (e) { toast(errText(e), 'bad'); return; }
    if (!item) { beep('ng'); openRegister(v.jan, (it) => dispatchItem(it)); return; }
    speak(Logic.speechText(item));
    dispatchItem(item);
  } finally { S.scanBusy = false; kbdFocus(); }
}

function dispatchItem(item) {
  const m = S.mode;
  if (m === 'recv') {
    if (S.rcvTab === 'plan') {
      if (!S.rcv) { toast('先に入荷予定を選んでください（予定なしの現物は「予定なし」タブへ）', 'warn'); return; }
      rcvScan(item);
    } else {
      const st = S.spot;
      if (st && Logic.janKey(st.item.jan) === Logic.janKey(item.jan)) st.qty += 1;
      else S.spot = { item: item, qty: 1, location: item.location || '' };
      renderPanel();
    }
  } else if (m === 'ship') {
    toast('出荷は、検品済みの伝票を選んで確定します。伝票に紐づかない払い出しは「出庫」で行ってください', 'warn');
  } else if (m === 'issue') {
    const st = S.issue;
    if (st && Logic.janKey(st.item.jan) === Logic.janKey(item.jan)) st.qty += 1;
    else S.issue = { item: item, qty: 1, reason: st ? st.reason : '', memo: '' };
    renderPanel();
  } else if (m === 'move') {
    S.move = { item: item, to: (S.move && S.move.to) || S.lastMoveTo || '' };
    renderPanel();
  } else if (m === 'insp') {
    if (S.pick && !S.insp) pickScan(item); else inspScan(item);
  } else if (m === 'stk') {
    stkScan(item);
  } else {
    S.stockView.q = item.jan; renderPanel();
  }
}

/* ---------- ロケーション・伝票番号などのバーコード読み取り（Code 128／Code 39／QRも読む） ---------- */
const CODE_LABELS = { location: 'ロケーションのバーコードを読み取ってください', slip: '伝票番号のバーコードを読み取ってください', tracking: '送り状のバーコードを読み取ってください', jan: 'JANのバーコードを読み取ってください' };
async function startCodeScan(kind, cb) {
  S.codeScan = { kind: kind, cb: cb };
  updateCodeBar();
  if (S.cfg.kbd) { kbdFocus(true); return; }   // スキャナ入力モード: カメラは使わず、入力欄で受ける
  if (S.cam.state !== 'on' && S.cam.state !== 'starting') await camToggle();
  if (S.cam.state !== 'on') { S.codeScan = null; updateCodeBar(); }
}
function cancelCodeScan() { S.codeScan = null; updateCodeBar(); kbdFocus(); }
function onCodeScanned(text) {
  const cs = S.codeScan;
  S.codeScan = null; updateCodeBar();
  onDetected();
  if (cs && cs.cb) cs.cb(String(text).trim());
  kbdFocus();
}
function updateCodeBar() {
  const b = $('#codeBar'); if (!b) return;
  if (S.codeScan) { b.querySelector('span').textContent = (CODE_LABELS[S.codeScan.kind] || 'バーコードを読み取ってください') + (S.cfg.kbd ? '（スキャナ）' : ''); b.classList.add('on'); }
  else b.classList.remove('on');
}

/* ---------- 入荷 ---------- */
function persistRcv() { if (S.rcv) store.set('wms.rcv', S.rcv); else store.del('wms.rcv'); }
function renderRecv() {
  let h = stkBanner() + seg([['plan', '予定を消し込む'], ['spot', '予定なし（現物）']], S.rcvTab, 'rcvTab');
  if (S.rcvTab === 'spot') return h + renderSpot();
  return h + (S.rcv ? renderRcvSession() : renderPlanList());
}
const PLAN_STATUSES = ['入荷待ち', '検品中', '一部入荷', '完了', 'キャンセル'];
const PLAN_OPEN = ['入荷待ち', '検品中', '一部入荷'];
const STATUS_TAG = { '入荷待ち': 'warn', '検品中': 'warn', '一部入荷': 'warn', '完了': 'ok', 'キャンセル': '', '未検品': 'warn', '検品済': 'ok', '出荷済': 'ok' };
function planFilterOptions(cur) {
  return [['open', '進行中（入荷待ち・検品中・一部入荷）'], ['all', 'すべて']].concat(PLAN_STATUSES.map((x) => [x, x]))
    .map((o) => '<option value="' + esc(o[0]) + '" ' + (cur === o[0] ? 'selected' : '') + '>' + esc(o[1]) + '</option>').join('');
}
function planMatches(p, f) { return f === 'all' || (f === 'open' ? PLAN_OPEN.indexOf(p.status) >= 0 : p.status === f); }
function renderPlanList() {
  let h = lastBox(S.last.recv) +
    '<div class="row" style="margin:6px 0"><button class="btn pri grow" data-act="planNewToggle">＋ 入荷予定を作る</button><button class="btn" data-act="planReload">更新</button></div>';
  if (S.rcvShowNew) h += renderPlanNew();
  if (!S.cfg.gas) return h + noConfigHint();
  if (S.plans === null) return h + hint('読み込み中…');
  h += '<select data-in="planFilter" style="margin-bottom:6px">' + planFilterOptions(S.planFilter) + '</select>';
  const list = S.plans.filter((p) => planMatches(p, S.planFilter));
  if (!S.plans.length) return h + hint('入荷予定はまだありません。「＋ 入荷予定を作る」で、便や伝票の明細（SKUまたはJAN、予定数）を登録すると、届いた分をスキャンで消し込めます。');
  if (!list.length) return h + '<div class="card sub">この状態の入荷予定はありません。</div>';
  list.forEach((p) => {
    const open = PLAN_OPEN.indexOf(p.status) >= 0;
    h += '<div class="item ' + (open ? 'short' : (p.status === '完了' ? 'match' : '')) + '"><div class="row"><div class="grow"><div style="font-weight:700">' + esc(p.name) + '</div>' +
      '<div class="sub">' + esc(p.id) + '　作成 ' + esc(String(p.created).slice(5, 16)) + (p.supplier ? '　' + esc(p.supplier) : '') + '</div>' +
      '<div class="sub">予定 ' + p.planned + ' / 検品 ' + p.inspected + ' / 入荷済 ' + p.received + ' / 残 ' + p.remaining + '</div>' +
      '<div style="margin-top:4px"><span class="tag ' + (STATUS_TAG[p.status] || '') + '">' + esc(p.status) + '</span></div></div>' +
      '<div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm pri" data-act="rcvOpen" data-name="' + esc(p.name) + '">' + (open ? '消し込む' : '開く') + '</button>' +
      (open && p.received === 0 ? '<button class="btn sm" data-act="planCancel" data-name="' + esc(p.name) + '">キャンセル</button>' : '') + '</div></div></div>';
  });
  return h;

function rcvScan(item) {
  const s = S.rcv, key = Logic.janKey(item.jan);
  let l = s.lines.find((x) => x.key === key);
  if (!l) { l = { jan: item.jan, key: key, name: item.name, location: item.location || '', stock: item.stock, planned: 0, inspected: 0, received: 0, state: '', now: 0, loc: item.location || '', extra: true }; s.lines.push(l); }
  l.now += 1; s.last = key;
  persistRcv(); renderPanel();
  const el = document.querySelector('[data-row="' + CSS.escape(key) + '"]');

async function rcvCommit() {

async function grpStart() {

  if (!nos.length || S.sending) { if (!nos.length) toast('伝票を選んでください', 'warn'); return; }
  S.sending = true; renderPanel();
  try {
    const r = await api('slipGroupStart', { nos: nos, name: S.grpName.trim() });
    toast('出荷作業を開始しました：' + r.group + '（' + r.started + '伝票）', 'ok');
    S.slSel = {}; S.grpName = ''; beep('ok');
    S.sending = false; await refreshSlips();
  } catch (e) {
    beep('ng');
    const list = (e instanceof ApiError && e.data && (e.data.errors || (e.data.extra && e.data.extra.errors))) || [];
    toast(errText(e) + (list.length ? '：' + list.slice(0, 3).map((x) => x.no + ' ' + x.reason).join(' / ') : ''), 'bad');
  } finally { S.sending = false; renderPanel(); }
}

  catch (e) { toast(errText(e), 'bad'); }
}
async function pickOpen(group) {
  try {
    const r = await api('slipPicking', { group: group });
    const sv = store.get('wms.pick', null);
    const saved = sv && sv.group === group && sv.picked ? sv.picked : {};
    S.pick = { group: group, slips: r.slips, lines: r.lines.map((l) => Object.assign({}, l, { picked: Math.min(l.qty, saved[l.jan] || 0) })) };

function pickScan(item) {
  const p = S.pick; if (!p) return;

async function slipImport() {
  const text = S.slipForm.csv;
  if (!text.trim()) { toast('CSVを貼り付けるか、ファイルを選んでください', 'warn'); return; }
  S.sending = true; renderPanel();
  try {
    const r = await api('slipImport', { text: text });
    S.slipRes = r; S.unres = r.unresolved.length ? { retry: 'CSVを取り込む', list: r.unresolved } : null;
    toast('取り込みました：' + r.created + '伝票', r.created ? 'ok' : 'warn');
    S.sending = false; await refreshSlips();
  } catch (e) { toast(errText(e), 'bad'); }
  finally { S.sending = false; renderPanel(); }
}
async function slipCreateManual() {
  const f = S.slipForm, no = f.no.trim();
  if (!no) { toast('伝票番号を入れてください', 'warn'); return; }
  const p = Logic.parseCodeQtyText(f.lines, 1);
  if (!p.rows.length || p.errors.length) { toast(p.rows.length ? '明細に誤りがあります（' + p.errors[0].line + '行目）' : '明細が空です', 'warn'); return; }
  S.sending = true; renderPanel();
  try {
    await api('slipCreate', { no: no, items: p.rows.map((x) => ({ code: x.code, qty: x.qty })) });
    toast('伝票を作りました：' + no, 'ok');
    S.slipForm.no = ''; S.slipForm.lines = ''; S.unres = null;
    S.sending = false; await refreshSlips();
  } catch (e) {
    if (e instanceof ApiError && e.code === 'unresolved') S.unres = { retry: 'この伝票を作る', list: e.data.unresolved || [] };
    toast(errText(e), 'bad');
  } finally { S.sending = false; renderPanel(); }
}

    '<div class="card"><div class="sub">リスト照合は照合専用で、在庫は動いていません。入荷の計上は「入荷」タブの入荷予定で行います。</div>' +
    '<button class="btn block" style="margin-top:8px" data-act="inspDone">新しい照合を始める</button></div>';

function inspScan(item) {
  const s = S.insp;
  if (!s || s.saved) { toast('先に検品を始めてください（伝票を選ぶか、照合を開始）', 'warn'); return; }
  const key = Logic.janKey(item.jan);
  let r = s.rows.find((x) => x.key === key);
  if (!r) { r = { jan: item.jan, key: key, name: item.name, location: item.location || '', planned: 0, actual: 0 }; s.rows.push(r); }
  r.actual += 1; r.name = item.name; r.location = item.location || ''; s.last = key;
  persistInsp(); renderPanel();
  const el = document.querySelector('[data-row="' + CSS.escape(key) + '"]');
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function inspStart() {
  const u = S.inspSetup;
  const name = u.name.trim(); if (!name) { toast('名前を入れてください', 'warn'); return; }
  const p = Logic.parsePlanText(u.plan, u.defQty);
  u.errors = p.errors;
  if (!p.rows.length) { toast(p.errors.length ? '予定リストに誤りがあります' : '予定リストが空です', 'warn'); renderPanel(); return; }
  if (p.errors.length) { toast('誤りのある行は除いて開始します（' + p.errors.length + '行）', 'warn'); }
  S.insp = {
    kind: 'list', name: name, started: Date.now(), last: null, saved: null,
    rows: p.rows.map((r) => { const it = S.master.get(r.key); return { jan: r.jan, key: r.key, name: it ? it.name : (r.name || ''), location: it ? (it.location || '') : '', planned: r.planned, actual: 0 }; })
  };
  persistInsp(); renderPanel();
}
async function inspDraft() {
  const s = S.insp; if (!s || s.kind !== 'slip' || S.sending) return;
  S.sending = true; renderPanel();
  try {
    const r = await api('slipInspect', { no: s.slipNo, items: s.rows.filter((x) => x.planned > 0).map((x) => ({ jan: x.jan, count: x.actual })) });
    toast('途中保存しました（' + r.slip.status + '）。別の端末からも続きを検品できます', 'ok');
    S.sending = false; refreshSlipsQuiet();
  } catch (e) { toast(errText(e), 'bad'); }
  finally { S.sending = false; renderPanel(); }
}
async function inspSave() {
  const s = S.insp; if (!s || S.sending) return;
  const items = s.rows.filter((r) => r.planned > 0 || r.actual > 0).map((r) => ({ jan: r.jan, planned: r.planned, actual: r.actual, name: r.name }));
  if (!items.length) { toast('保存する行がありません', 'warn'); return; }
  const sum = Logic.inspSummary(s.rows), isSlip = s.kind === 'slip';
  const ok = await confirmDialog({ title: isSlip ? '検品済みにする' : '照合を確定して保存', ok: isSlip ? '検品済みにする' : '保存する',
    body: '<div>' + esc(s.name) + '</div><div class="sub">一致 ' + sum.match + ' / 不足 ' + sum.short + ' / 超過 ' + sum.over + ' / 予定外 ' + sum.extra + '</div>' + (sum.allOk ? '<div class="tag ok">検品OK</div>' : '<div class="tag warn">差異あり</div>') +
      (isSlip ? '<div class="sub" style="margin-top:6px">在庫は動きません。出荷は「出荷」タブで確定します。</div>' : '') });
  if (!ok) return;
  S.sending = true; renderPanel();
  try {
    if (isSlip) {
      await api('slipInspect', { no: s.slipNo, items: items.map((x) => ({ jan: x.jan, count: x.actual })), tracking: s.trkScan });
      s.saved = { slip: true };
      toast('検品済みにしました', 'ok');
      S.sending = false; refreshSlipsQuiet();
    } else {
      const r = await api('inspectionSave', { name: s.name, items: items });
      s.saved = { matched: r.matched, short: r.short, over: r.over, unplanned: r.unplanned, allOk: r.allOk };
      toast('検品履歴に保存しました', 'ok');
    }
    persistInsp(); beep('ok');
  } catch (e) {
    beep('ng');
    let m = errText(e);
    if (e instanceof ApiError && e.code === 'not_matched') m = '明細と実績が一致しません（' + ((e.data.diffs || []).length) + '品）。実物を直してやり直してください';
    toast(m, 'bad');
  } finally { S.sending = false; renderPanel(); }
}

/* ---------- 棚卸（①開始 → ②実在庫入力 → ③確定） ---------- */
function persistStk() { if (S.stk) store.set('wms.stk', S.stk); else store.del('wms.stk'); }
function stkSteps(n) {
  const names = ['① 開始', '② 実在庫入力', '③ 確定'];
  return '<div class="steps">' + names.map((t, i) => '<span class="' + (i + 1 === n ? 'cur' : (i + 1 < n ? 'done' : '')) + '">' + t + '</span>').join('') + '</div>';
}
function renderStk() {
  const s = S.stk;
  if (!s) {
    const u = S.stkSetup; if (!u.name) u.name = '棚卸 ' + stamp();
    const locs = locations();
    return stkSteps(1) + '<div class="card"><div class="name">棚卸を始める</div><div class="sub">実物をスキャンして数え、帳簿在庫との差異を確認して、確定で在庫を実績に合わせます。<b>棚卸が終わるまで、入荷・出荷・出庫・棚移動は行わないでください。</b></div>' +
      '<label class="f">棚卸名</label><input type="text" data-in="stkName" value="' + esc(u.name) + '" autocomplete="off">' +
      '<label class="f">範囲（何も選ばなければ「すべて」）</label><div class="chips">' +
      (locs.length ? locs.map((l) => '<label><input type="checkbox" data-in="stkScope" value="' + esc(l) + '" ' + (u.scope.indexOf(l) >= 0 ? 'checked' : '') + '>' + esc(l) + '</label>').join('') : '<span class="sub">ロケーションがまだありません（すべて）</span>') + '</div>' +
      '<label class="f">数えていない商品の扱い（範囲内）</label>' +
      '<div class="chips"><label><input type="radio" name="unc" data-in="stkUnc" value="keep" ' + (u.uncounted === 'keep' ? 'checked' : '') + '>そのまま（既定）</label>' +
      '<label><input type="radio" name="unc" data-in="stkUnc" value="zero" ' + (u.uncounted === 'zero' ? 'checked' : '') + '>0とみなす</label></div>' +
      '<div class="sub" style="margin-top:6px">「0とみなす」は、ロケーションを絞った棚卸で使うのがおすすめです。範囲外の商品は触りません。</div>' +
      '<button class="btn pri block" style="margin-top:10px" data-act="stkStart">棚卸を開始</button></div>' + noConfigHint();
  }
  if (s.result) return stkSteps(3) + renderStkResult();
  const v = Logic.stkView(s, allItems());
  let h = stkSteps(2) + '<div class="card"><div class="row"><div class="grow"><div class="name">' + esc(s.name) + '</div><div class="sub">範囲：' + (s.scope.length ? esc(s.scope.join('、')) : 'すべて') + ' ／ 未カウント：' + (s.uncounted === 'zero' ? '0とみなす' : 'そのまま') + '</div></div></div>' +
    '<div class="kv"><div>カウント済<b>' + v.counted.length + '品</b></div><div>未カウント（範囲内）<b>' + v.uncounted.length + '品</b></div></div>' +
    '<button class="btn sm" data-act="stkToggleUn">' + (S.stkShowUncounted ? '未カウントを隠す' : '未カウントを見る') + '</button></div>';
  if (S.stkShowUncounted) {
    h += '<div class="card"><div class="sub">未カウント（範囲内）</div>' + (v.uncounted.length ? '<table class="t">' + v.uncounted.map((it) => '<tr><td>' + esc(it.name) + '<div class="sub">' + esc(it.jan) + '</div></td><td><span class="tag loc">' + esc(it.location || '未設定') + '</span></td><td class="n">帳簿 ' + it.stock + '</td></tr>').join('') + '</table>' : '<div class="tag ok">なし</div>') + '</div>';
  }
  v.counted.forEach((r) => {
    const cls = r.diff === 0 ? 'match' : (r.diff < 0 ? 'short' : 'over');
    h += '<div class="item ' + cls + (s.last === r.key ? ' hot' : '') + '" data-row="' + esc(r.key) + '"><div class="row"><div class="grow"><div style="font-weight:700">' + esc(r.name) + '</div>' +
      '<div class="sub">' + esc(r.jan) + ' <span class="tag loc">' + esc(r.location || '未設定') + '</span>' + (r.outOfScope ? ' <span class="tag warn">範囲外ロケ</span>' : '') + '</div></div>' +
      '<div class="nums" style="text-align:right">帳簿 ' + r.book + '<br>差異 <span class="' + (r.diff === 0 ? 'diff-zero' : r.diff < 0 ? 'diff-neg' : 'diff-pos') + '"><b>' + (r.diff > 0 ? '+' : '') + r.diff + '</b></span></div></div>' +
      '<div class="row" style="margin-top:6px;justify-content:flex-end"><div class="mini"><button data-act="stkAdj" data-key="' + esc(r.key) + '" data-d="-1">−</button>' +
      '<input type="number" id="sa-' + esc(r.key) + '" data-in="stkActual" data-key="' + esc(r.key) + '" inputmode="numeric" min="0" value="' + r.actual + '" style="width:72px;text-align:center" aria-label="実績数">' +
      '<button data-act="stkAdj" data-key="' + esc(r.key) + '" data-d="1">＋</button><button data-act="stkDel" data-key="' + esc(r.key) + '" aria-label="取り消し">✕</button></div></div></div>';
  });
  h += '<div class="row" style="margin-top:10px"><button class="btn" data-act="stkAbort">中止（入力を破棄）</button><button class="btn pri grow" data-act="stkConfirm" ' + (S.sending || !v.counted.length ? 'disabled' : '') + '>③ 差異を確認して確定</button></div>';
  return h;
}
function renderStkResult() {
  const r = S.stk.result;
  return '<div class="banner ok">棚卸を確定しました<small>' + esc(S.stk.name) + '</small></div><div class="card"><div class="kv"><div>差異あり<b>' + r.adjust + '品</b></div><div>0とみなした<b>' + r.zeroed + '品</b></div></div>' +
    '<div class="sub">在庫は実績に合わせ、差異分は入出荷履歴（棚卸調整）と棚卸履歴に残しました。他の在庫操作を再開できます。</div><button class="btn pri block" style="margin-top:8px" data-act="stkDone">終了</button></div>';
}
function stkScan(item) {
  const s = S.stk;
  if (!s || s.result) { toast('先に「棚卸を開始」してください', 'warn'); return; }
  const key = Logic.janKey(item.jan);
  if (!s.counts[key]) s.counts[key] = { jan: item.jan, actual: 0 };
  s.counts[key].actual += 1; s.last = key;
  s.order = [key].concat((s.order || []).filter((k) => k !== key));
  persistStk(); renderPanel();
}
function stkPayload() {
  const s = S.stk;
  return { name: s.name, uncounted: s.uncounted, scope: { locations: s.scope },
    counts: Object.keys(s.counts).map((k) => ({ jan: s.counts[k].jan, actual: s.counts[k].actual })) };
}
async function stkConfirm() {
  const s = S.stk; if (!s || S.sending) return;
  S.sending = true; renderPanel();
  let p;
  try { p = await api('stocktakePreview', stkPayload()); }
  catch (e) { toast(errText(e), 'bad'); S.sending = false; renderPanel(); return; }
  S.sending = false; renderPanel();
  const diffs = p.rows.filter((r) => r.diff !== 0);
  const warnAll = s.uncounted === 'zero' && s.scope.length === 0 && p.zeroed > 0;
  const body = '<div class="kv"><div>差異あり<b>' + p.adjust + '品</b></div><div>0とみなす<b>' + p.zeroed + '品</b></div></div>' +
    (warnAll ? '<div class="err">範囲が「すべて」で、数えていない ' + p.zeroed + ' 品の在庫を0にします。よろしいですか？</div>' : '') +
    (diffs.length ? '<table class="t"><tr><th>商品</th><th class="n">帳簿</th><th class="n">実績</th><th class="n">差</th></tr>' +
      diffs.slice(0, 40).map((r) => '<tr><td>' + esc(r.name) + (r.zeroed ? ' <span class="tag warn">未カウント</span>' : '') + (r.outOfScope ? ' <span class="tag warn">範囲外ロケ</span>' : '') + '<div class="sub">' + esc(r.location || '') + '</div></td><td class="n">' + r.book + '</td><td class="n">' + r.actual + '</td><td class="n ' + (r.diff < 0 ? 'diff-neg' : 'diff-pos') + '">' + (r.diff > 0 ? '+' : '') + r.diff + '</td></tr>').join('') + '</table>' + (diffs.length > 40 ? '<div class="sub">ほか' + (diffs.length - 40) + '品</div>' : '') : '<div class="tag ok">差異はありません</div>');
  const ok = await confirmDialog({ title: '③ 棚卸を確定', ok: '確定する', danger: warnAll, body: body });
  if (!ok) return;
  S.sending = true; renderPanel();
  try {
    const r = await api('stocktakeSave', stkPayload());
    (r.items || []).forEach(putItem);
    s.result = { adjust: r.adjust, zeroed: r.zeroed }; persistStk(); beep('ok'); toast('棚卸を確定しました', 'ok');
  } catch (e) { toast(errText(e), 'bad'); }
  finally { S.sending = false; renderPanel(); }
}

  try {
    if (navigator.permissions && navigator.permissions.query) { const p = await navigator.permissions.query({ name: 'camera' }); L.push('カメラ許可: ' + p.state); }
    else L.push('カメラ許可: 取得できません（この環境）');
  } catch (e) { L.push('カメラ許可: 取得できません'); }
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      const d = (await navigator.mediaDevices.enumerateDevices()).filter((x) => x.kind === 'videoinput'); L.push('カメラ台数: ' + d.length);
    }
  } catch (e) { }
  L.push('カメラ状態: ' + S.cam.state + (S.cam.lastError ? '\n直近のエラー: ' + S.cam.lastError : ''));
  L.push('端末: ' + navigator.userAgent);
  showOut('#diagOut', L.join('\n'));
}

/* ---------- 写真から読む ---------- */
async function readPhoto(file) {
  if (!file) return;
  if (!Scanner.ready()) { toast('ZXing-js を読み込めていません', 'bad'); return; }
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('画像を開けません')); i.src = url; });
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d', { willReadFrequently: true });
    let text = null;
    for (const maxW of [1600, 1000, 640]) {
      const sc = Math.min(1, maxW / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
      cv.width = w; cv.height = h; ctx.drawImage(img, 0, 0, w, h);
      const gray = Logic.rgbaToGray(ctx.getImageData(0, 0, w, h).data, w, h);
      const dec = S.codeScan ? Scanner.decodeCode : Scanner.decode;
      text = dec(gray, w, h) || dec(Logic.rotate90Gray(gray, w, h), h, w);
      if (text) break;
    }
    URL.revokeObjectURL(url);
    if (!text) { beep('ng'); toast('バーコードを読み取れませんでした。バーコードを大きく、水平に撮ってください', 'warn'); return; }
    onScan(text);
  } catch (e) { toast(errText(e), 'bad'); }
}

/* ---------- PWA ---------- */
function setupManifest() {
  try {
    const icon = document.querySelector('link[rel=icon]').href;
    const m = { name: '簡易WMS', short_name: '簡易WMS', display: 'standalone', orientation: 'portrait',
      start_url: location.href.split('#')[0], scope: location.href.split('#')[0].replace(/[^/]*$/, ''),
      background_color: '#0f766e', theme_color: '#0f766e', icons: [{ src: icon, sizes: '180x180', type: 'image/png', purpose: 'any' }] };
    const l = document.createElement('link'); l.rel = 'manifest';
    l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
    document.head.appendChild(l);
  } catch (e) { /* マニフェストが無くても、metaタグでホーム画面に追加できる */ }
}

/* ---------- 起動 ---------- */
/** URLの #gas=…&token=… を設定に取り込み、アドレスバーから消す（初回の入力を楽にするため） */
function applyFragment() {
  const frag = Logic.parseFragment(location.hash);
  if (!frag) return false;
  if (frag.gas) S.cfg.gas = frag.gas;
  if (frag.token) { S.cfg.token = frag.token; setTimeout(() => toast('リンクに合言葉が含まれていました。このリンクは他の人に送らないでください（初回設定は手入力が安全です）', 'warn'), 600); }
  saveCfg();
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
  return true;
}
window.addEventListener('hashchange', () => { if (applyFragment()) { toast('設定を取り込みました', 'ok'); loadMaster(); } });

  applyFragment();

  if (window.speechSynthesis) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { }; } catch (e) { } }
  if (S.cfg.gas) { loadMaster(); onEnterMode(); }
  window.__wms = { S: S, Logic: Logic, Scanner: Scanner, Actions: Actions, api: api, onScan: onScan, handleDetected: handleDetected };
})();
